[package]
name = "mscout"
version = "0.10.0"
description = "Read-only observation overlay for MapleStory Classic World"
license = "MIT"
repository = "https://github.com/xinye83/mscout"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mscout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
wz_reader = { version = "0.0.26", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
  "Foundation",
  "Globalization",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Data_Xml_Dom",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "UI_Notifications",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The fixture corpus in `testdata/` is lossless PNG. The production `image`
# dependency ships with `default-features = false` (no codec at all), so tests
# enable the PNG decoder for themselves only; the reader's dependency list is
# unchanged. `png` is already in Cargo.lock via tauri-codegen, so this resolves
# offline.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
